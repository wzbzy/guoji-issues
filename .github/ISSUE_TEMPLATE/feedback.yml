name: 问题反馈
description: 提交使用问题或改进建议（商城 / ERP / 3D 编辑器）
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！信息越完整处理越快。带 * 的为必填。
        **如果是"改了 A 处、B 处没跟着变"的问题，请务必写清：A 具体改了什么（哪个页面、哪个字段、改成什么值）+ B 具体哪里没变（哪个页面、哪个显示项）。**
  - type: dropdown
    id: module
    attributes:
      label: 模块 *
      description: 问题出现在哪个系统
      options:
        - 商城（mall）
        - ERP
        - 3D 编辑器（erp3d）
        - 其他/跨模块
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 类型 *
      options:
        - bug（功能坏了 / 数据不对）
        - enhancement（新功能 / 改进建议）
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级 *
      options:
        - P0（紧急，影响业务）
        - P1（重要，可排期）
        - P2（一般，有空处理）
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述 *
      description: 现象是什么？期望是什么？如果是"改了 A、B 没变"，写清 A 的具体字段和值、B 的具体位置。
      placeholder: |
        例：公司主体管理里把某主体的虚拟代码从 0001 改成 0002 并保存后，
        客户档案的「专用付款帐号」仍显示按 0001 生成的旧号码，期望自动变成新号码。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 怎么一步步走到这个问题的；修改过的值请写具体（从什么改成什么）
      placeholder: |
        1. 打开……把××从 A 改成 B，保存
        2. 打开……查看
        3. 看到……仍是旧值
  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 直接拖图或 Ctrl+V 粘贴；**请用红框圈出"没有变化的那个值"**——红框比文字更快定位
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 涉及的门店 / 单据号 / 账号等（可选）
