name: 问题反馈
description: 提交使用问题或改进建议（商城 / ERP / 3D 编辑器）
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！信息越完整处理越快。带 * 的为必填。
  - type: dropdown
    id: module
    attributes:
      label: 模块 *
      description: 问题出现在哪个系统
      options:
        - 商城（mall）
        - ERP
        - 3D 编辑器（erp3d）
        - 其他/跨模块
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 类型 *
      options:
        - bug（功能坏了 / 数据不对）
        - enhancement（新功能 / 改进建议）
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级 *
      options:
        - P0（紧急，影响业务）
        - P1（重要，可排期）
        - P2（一般，有空处理）
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述 *
      description: 现象是什么？期望是什么？
      placeholder: 例如：产品详情页图片未压缩，进入很慢，期望加上压缩。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 怎么一步步走到这个问题的
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 直接把图片拖进输入框
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 涉及的门店 / 单据号 / 账号等（可选）
